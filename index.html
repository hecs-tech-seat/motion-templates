const grid = document.getElementById("grid");
const count = document.getElementById("count");
const empty = document.getElementById("empty");
const q = document.getElementById("q");
const dialog = document.getElementById("detail");
const detailBody = document.getElementById("detail-body");
let filter = "all";

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function visible() {
  const query = q.value.trim().toLowerCase();
  return ITEMS.filter(item => {
    if (filter !== "all" && item.industry !== filter) return false;
    if (!query) return true;
    const blob = [item.title, item.original, item.author, item.motion, item.platform, INDUSTRY[item.industry], item.draft].join(" ").toLowerCase();
    return blob.includes(query);
  });
}

function render() {
  const list = visible();
  count.textContent = list.length + " 筆參考";
  empty.hidden = list.length !== 0;
  grid.innerHTML = list.map(item => `
    <button class="card" type="button" data-id="${item.id}">
      <div class="poster ${item.industry}">
        <span class="ind">${INDUSTRY[item.industry]}</span>
        <span class="mark">${esc(item.platform)}</span>
      </div>
      <div class="body">
        <h2>${esc(item.title)}</h2>
        <div class="meta">${esc(item.author)}</div>
        <div class="motion">${esc(item.motion)}</div>
      </div>
    </button>
  `).join("");
}

function openItem(id) {
  const item = ITEMS.find(x => x.id === id);
  if (!item) return;
  const promptBlock = item.authorPrompt
    ? `<div class="block"><h4>作者在頁面公開的句子</h4><p>${esc(item.authorPrompt)}</p><p class="meta">${esc(item.authorPromptNote || "")}</p></div>`
    : `<div class="block"><h4>作者提示詞</h4><p>原貼未公開提示詞</p></div>`;
  detailBody.innerHTML = `
    <h3>${esc(item.title)}</h3>
    <p class="en">${esc(item.original)}</p>
    <dl>
      <dt>產業</dt><dd>${INDUSTRY[item.industry]}</dd>
      <dt>作者</dt><dd>${esc(item.author)}</dd>
      <dt>平台</dt><dd>${esc(item.platform)}</dd>
      <dt>動作</dt><dd>${esc(item.motion)}</dd>
    </dl>
    ${promptBlock}
    <div class="block">
      <span class="label">我們整理的草稿</span>
      <h4>可改寫的拍攝提示詞草稿</h4>
      <p>${esc(item.draft)}</p>
    </div>
    <a class="source" href="${esc(item.url)}" target="_blank" rel="noopener noreferrer">打開原始來源</a>
  `;
  if (!dialog.open) dialog.showModal();
}

grid.addEventListener("click", e => {
  const card = e.target.closest("button.card");
  if (card) openItem(card.dataset.id);
});
document.querySelectorAll("button.chip").forEach(btn => {
  btn.addEventListener("click", () => {
    filter = btn.dataset.filter;
    document.querySelectorAll("button.chip").forEach(b => b.setAttribute("aria-pressed", b === btn ? "true" : "false"));
    render();
  });
});
q.addEventListener("input", render);
document.getElementById("close").addEventListener("click", () => dialog.close());
dialog.addEventListener("click", e => { if (e.target === dialog) dialog.close(); });
render();
</script>
